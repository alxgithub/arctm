<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCTM — aplicações</title>
<style>
  :root{ --verde:#1E8F42; --azul:#2A8FC4; --amarelo:#C9A400; --papel:#F3F8F4; --tinta:#10301D; --linha:#CFE0D6; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;background:var(--papel);color:var(--tinta);padding:32px 20px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .caixa{max-width:640px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px}
  p.sub{margin:0 0 26px;color:#4C6B57;font-size:15px}
  a.item{
    display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--linha);
    border-left:5px solid var(--verde);border-radius:14px;padding:16px 18px;margin-bottom:12px;
    text-decoration:none;color:inherit;
  }
  a.item.b{border-left-color:var(--azul)}
  a.item.c{border-left-color:var(--amarelo)}
  .ic{font-size:30px;line-height:1}
  .txt b{display:block;font-size:17px;margin-bottom:2px}
  .txt span{font-size:13.5px;color:#4C6B57}
  .nota{margin-top:22px;font-size:13px;color:#6A8375;line-height:1.6}
</style>
</head>
<body>
  <div class="caixa">
    <h1>Aplicações</h1>
    <p class="sub">Escolha a aplicação a abrir neste dispositivo.</p>
    <a class="item" href="pos/"><span class="ic">&#129534;</span>
      <span class="txt"><b>Registadora</b><span>Vender ao balcão, caixa e relatórios</span></span></a>
    <a class="item b" href="senhas/"><span class="ic">&#128290;</span>
      <span class="txt"><b>Visor de senhas</b><span>Chamada de senhas para ecrã grande</span></span></a>
    <a class="item c" href="pedidos/"><span class="ic">&#127869;</span>
      <span class="txt"><b>Visor de pedidos</b><span>Em preparação e a entregar</span></span></a>
    <div class="nota">É preciso ter sessão iniciada na conta do Claude no dispositivo que abrir estas aplicações.</div>
  </div>
</body>
</html>
